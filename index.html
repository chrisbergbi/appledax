<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>APPLEDAX</title>
</head>
<body>
  <div id="app">
    <!-- Activity Bar (leftmost column, icon-only) -->
    <aside id="activity-bar">
      <div class="ab-top">
        <button class="ab-btn" data-panel="model-browser" data-i18n-title="drawer.model" title="Model">
          <span class="ab-icon">&#9776;</span>
        </button>
        <button class="ab-btn" data-panel="expression-library" data-i18n-title="drawer.saved" title="Saved">
          <span class="ab-icon">&#128190;</span>
        </button>
        <button class="ab-btn" data-panel="best-practices" data-i18n-title="drawer.tips" title="Tips">
          <span class="ab-icon">&#128161;</span>
        </button>
      </div>
      <div class="ab-bottom">
        <button class="ab-btn" id="btn-theme" title="Toggle theme">
          <span class="ab-icon">&#9790;</span>
        </button>
        <button class="ab-btn" id="btn-lang" data-i18n-title="app.btn_lang_title" title="Switch language">
          <span class="ab-icon ab-lang-icon">NL</span>
        </button>
      </div>
    </aside>

    <!-- Left Sidebar (Model / Saved / Tips) -->
    <aside id="left-sidebar" class="sidebar collapsed">
      <div class="sidebar-header">
        <div class="sidebar-tabs" id="left-sidebar-tabs">
          <button class="sidebar-tab" data-panel="model-browser" data-i18n="drawer.model">Model</button>
          <button class="sidebar-tab" data-panel="expression-library" data-i18n="drawer.saved">Saved</button>
          <button class="sidebar-tab" data-panel="best-practices" data-i18n="drawer.tips">Tips</button>
        </div>
        <button class="sidebar-close" id="left-sidebar-close" data-i18n-title="sidebar.close" title="Close sidebar">&times;</button>
      </div>
      <div class="sidebar-content" id="left-sidebar-content">
        <div id="model-browser-panel" class="sidebar-panel"></div>
        <div id="expression-library-panel" class="sidebar-panel"></div>
        <div id="best-practices-panel" class="sidebar-panel"></div>
      </div>
    </aside>

    <!-- Left Resize Handle -->
    <div id="left-resize-handle" class="resize-handle-h"></div>

    <!-- Main Area (editor + status + diagnostics) -->
    <div id="main-area">
      <!-- Editor Header (breadcrumb + actions) -->
      <div id="editor-header">
        <div id="editor-breadcrumb">
          <span class="breadcrumb-icon">fx</span>
          <span class="breadcrumb-title" id="breadcrumb-name" data-i18n="app.untitled">Untitled measure</span>
        </div>
        <div id="editor-actions">
          <button id="btn-format" data-icon="&#9998;" data-i18n="app.btn_format" data-i18n-title="app.btn_format_title" title="Format DAX (Shift+Alt+F)">Format</button>
          <button id="btn-copy" data-icon="&#128203;" data-i18n="app.btn_copy" data-i18n-title="app.btn_copy_title" title="Copy formatted DAX">Copy</button>
        </div>
      </div>

      <!-- Editor -->
      <main id="editor-area">
        <div id="editor-pane"></div>
      </main>

      <!-- Status bar -->
      <div id="status-bar">
        <span id="status-text" data-i18n="status.all_good">No issues found</span>
        <span id="status-toggle" title="Details">&#9660;</span>
      </div>

      <!-- Diagnostics dropdown (hidden by default) -->
      <div id="diagnostics-dropdown" class="hidden">
        <div id="diagnostics-tabs">
          <button class="diag-tab active" data-severity="all">
            <span data-i18n="diag.all">All</span> <span class="badge" id="badge-all">0</span>
          </button>
          <button class="diag-tab" data-severity="error">
            <span data-i18n="diag.errors">Errors</span> <span class="badge error" id="badge-errors">0</span>
          </button>
          <button class="diag-tab" data-severity="warning">
            <span data-i18n="diag.warnings">Warnings</span> <span class="badge warning" id="badge-warnings">0</span>
          </button>
          <button class="diag-tab" data-severity="info">
            <span data-i18n="diag.info">Info</span> <span class="badge info" id="badge-info">0</span>
          </button>
        </div>
        <div id="diagnostics-list"></div>
      </div>
    </div>

    <!-- Right Resize Handle -->
    <div id="right-resize-handle" class="resize-handle-h"></div>

    <!-- Right Sidebar (AI Assistant) -->
    <aside id="right-sidebar" class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title" data-i18n="sidebar.ai_title">AI ASSISTANT</span>
        <button class="sidebar-close" id="right-sidebar-close" data-i18n-title="sidebar.close" title="Close sidebar">&times;</button>
      </div>
      <div class="sidebar-content" id="right-sidebar-content">
        <div id="ai-assistant-panel" class="sidebar-panel active"></div>
      </div>
    </aside>

    <!-- Sidebar backdrop (visible on tablet/mobile when a sidebar is open) -->
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

    <!-- Floating AI button (visible when AI sidebar is closed) -->
    <button id="ai-fab" class="hidden" title="Open AI Assistant">
      <span>AI</span>
    </button>

    <!-- Welcome overlay (first visit) -->
    <div id="welcome-overlay" class="hidden">
      <div id="welcome-card">
        <h2 data-i18n="welcome.title">Write your first DAX expression</h2>
        <p data-i18n="welcome.subtitle">Pick a template to get started, or just start typing in the editor.</p>
        <div id="welcome-templates">
          <button class="welcome-template" data-template="simple">
            <span class="welcome-template-icon">fx</span>
            <span class="welcome-template-title" data-i18n="welcome.template_simple">Simple Measure</span>
            <span class="welcome-template-desc" data-i18n="welcome.template_simple_desc">SUM, AVERAGE, COUNT</span>
          </button>
          <button class="welcome-template" data-template="yoy">
            <span class="welcome-template-icon">&#128200;</span>
            <span class="welcome-template-title" data-i18n="welcome.template_yoy">Year-over-Year</span>
            <span class="welcome-template-desc" data-i18n="welcome.template_yoy_desc">Compare with last year</span>
          </button>
          <button class="welcome-template" data-template="calculate">
            <span class="welcome-template-icon">&#9881;</span>
            <span class="welcome-template-title" data-i18n="welcome.template_calculate">CALCULATE Pattern</span>
            <span class="welcome-template-desc" data-i18n="welcome.template_calculate_desc">Modify filter context</span>
          </button>
        </div>
        <button id="welcome-dismiss" data-i18n="welcome.dismiss">Skip &mdash; start with empty editor</button>
      </div>
    </div>
  </div>
  <script src="https://js.puter.com/v2/"></script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
