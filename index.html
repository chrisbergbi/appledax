<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>APPLEDAX</title>
</head>
<body>
  <div id="app">
    <!-- Toolbar -->
    <header id="toolbar">
      <h1 data-i18n="app.title">APPLEDAX</h1>
      <div id="toolbar-actions">
        <button id="btn-format" data-i18n="app.btn_format" data-i18n-title="app.btn_format_title" title="DAX opmaken (Shift+Alt+F)">Opmaak</button>
        <button id="btn-copy" data-i18n="app.btn_copy" data-i18n-title="app.btn_copy_title" title="Opgemaakte DAX kopiëren">Kopieer</button>
        <button id="btn-lang" data-i18n-title="app.btn_lang_title" title="Switch language">NL</button>
        <button id="btn-theme" title="Thema wisselen">&#9790;</button>
      </div>
    </header>

    <!-- Editor (full width) -->
    <main id="editor-area">
      <div id="editor-pane"></div>
    </main>

    <!-- Status bar (compact suggestion count) -->
    <div id="status-bar">
      <span id="status-text" data-i18n="status.all_good">Geen problemen gevonden</span>
      <span id="status-toggle" title="Details">&#9660;</span>
    </div>

    <!-- Diagnostics dropdown (hidden by default) -->
    <div id="diagnostics-dropdown" class="hidden">
      <div id="diagnostics-tabs">
        <button class="diag-tab active" data-severity="all">
          <span data-i18n="diag.all">Alles</span> <span class="badge" id="badge-all">0</span>
        </button>
        <button class="diag-tab" data-severity="error">
          <span data-i18n="diag.errors">Fouten</span> <span class="badge error" id="badge-errors">0</span>
        </button>
        <button class="diag-tab" data-severity="warning">
          <span data-i18n="diag.warnings">Waarschuwingen</span> <span class="badge warning" id="badge-warnings">0</span>
        </button>
        <button class="diag-tab" data-severity="info">
          <span data-i18n="diag.info">Info</span> <span class="badge info" id="badge-info">0</span>
        </button>
      </div>
      <div id="diagnostics-list"></div>
    </div>

    <!-- Bottom drawer tab bar -->
    <nav id="drawer-tabs">
      <button class="drawer-tab" data-drawer="function-help" data-i18n="drawer.help">Hulp</button>
      <button class="drawer-tab" data-drawer="model-browser" data-i18n="drawer.model">Model</button>
      <button class="drawer-tab" data-drawer="expression-library" data-i18n="drawer.saved">Opgeslagen</button>
      <button class="drawer-tab" data-drawer="best-practices" data-i18n="drawer.tips">Tips</button>
    </nav>

    <!-- Bottom drawer (collapsible) -->
    <div id="drawer" class="collapsed">
      <div id="drawer-handle"></div>
      <div id="drawer-content">
        <div id="function-help-panel" class="drawer-panel"></div>
        <div id="best-practices-panel" class="drawer-panel"></div>
        <div id="model-browser-panel" class="drawer-panel"></div>
        <div id="expression-library-panel" class="drawer-panel"></div>
      </div>
    </div>

    <!-- Welcome overlay (first visit) -->
    <div id="welcome-overlay" class="hidden">
      <div id="welcome-card">
        <h2 data-i18n="welcome.title">Schrijf je eerste DAX-expressie</h2>
        <p data-i18n="welcome.subtitle">Kies een template om te beginnen, of begin met typen in de editor.</p>
        <div id="welcome-templates">
          <button class="welcome-template" data-template="simple">
            <span class="welcome-template-icon">fx</span>
            <span class="welcome-template-title" data-i18n="welcome.template_simple">Eenvoudige Measure</span>
            <span class="welcome-template-desc" data-i18n="welcome.template_simple_desc">SUM, AVERAGE, COUNT</span>
          </button>
          <button class="welcome-template" data-template="yoy">
            <span class="welcome-template-icon">&#128200;</span>
            <span class="welcome-template-title" data-i18n="welcome.template_yoy">Year-over-Year</span>
            <span class="welcome-template-desc" data-i18n="welcome.template_yoy_desc">Vergelijk met vorig jaar</span>
          </button>
          <button class="welcome-template" data-template="calculate">
            <span class="welcome-template-icon">&#9881;</span>
            <span class="welcome-template-title" data-i18n="welcome.template_calculate">CALCULATE Patroon</span>
            <span class="welcome-template-desc" data-i18n="welcome.template_calculate_desc">Filter context wijzigen</span>
          </button>
        </div>
        <button id="welcome-dismiss" data-i18n="welcome.dismiss">Overslaan &mdash; begin met lege editor</button>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
